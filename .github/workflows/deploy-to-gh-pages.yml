name: Deploy to github pages
on:
  push:
    branches:
    - master

permissions:
  contents: write

jobs:
  deploy-to-external-gh-pages:
    name: Deploy spec site to github pages
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch event to site-gen-repo
        run: |
          curl -X POST https://api.github.com/repos/wamp-proto/wamp-site-gen/dispatches \
          -H 'Accept: application/vnd.github.everest-preview+json' \
          -H 'Authorization: token ${{ secrets.ACCESS_TOKEN }}' \
          --data '{"event_type": "publish", "client_payload": { "repository": "'"$GITHUB_REPOSITORY"'", "commit_sha": "'"$GITHUB_SHA"'" }}'
  deploy-to-gh-pages:
    name: Deploy spec site to github pages
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout Repo/Branch
        uses: actions/checkout@v4

      # The spec+website build was migrated from `make` to `just`+`uv` in #553; the
      # steps below mirror the proven-green PR workflow `build-and-test.yml` so the
      # publish path uses the same toolchain (previously this job still called
      # `make build`, which no longer exists -> the deploy failed on every push, #568).
      - name: Set Environment Variables
        run: |
          echo "PATH=$HOME/.local/bin/:$PATH" >> $GITHUB_ENV
          echo "PATH=$HOME/.cargo/bin/:$PATH" >> $GITHUB_ENV
          echo "WAMP_BUILD_ID=$(date -u "+%Y%m%d")-$(git rev-parse --short ${GITHUB_SHA})" >> $GITHUB_ENV

      - name: Install OS Packages
        run: |
          sudo apt update
          sudo apt install -y libcairo2-dev libenchant-2-2 libharfbuzz0b libpango1.0-dev libpangoft2-1.0-0 libxml2-utils
          sudo apt install -y enscript mmark weasyprint
          # imagemagick provides `convert`, used by `just optimize-images` to
          # generate docs/_static/img/favicon.ico from favicon.svg
          sudo apt install -y imagemagick

      - name: Setup Toolchain I (Just, UV)
        run: |
          # Install Just direct-from-upstream (see: https://just.systems/man/en/pre-built-binaries.html)
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.42.3 --force --to $HOME/.local/bin/
          which just
          just --version

          # Install UV direct-from-upstream (see: https://docs.astral.sh/uv/getting-started/installation/#standalone-installer)
          curl -LsSf https://astral.sh/uv/install.sh | sh
          which uv
          uv --version

      - name: Setup Toolchain II (Python venv, Python dependencies)
        run: |
          # Use Just to set up the Python venv, then install Python dependencies
          just create
          just install

      - name: Build Spec and Website
        run: |
          # build Sphinx-based website; build spec (RFC) in HTML, TXT and PDF -> ./dist
          just build

      - run: mv dist/_graphics dist/graphics
      - run: mv dist/_images dist/images
      - run: mv dist/_sources dist/sources
      - run: mv dist/_static dist/static
      - name: Rename underscore urls in dist
        run: find dist -type f \( -name "*.html" -or -name "*.txt" \) -print -exec sed -i 's/_graphics\//graphics\//g' {} \;
      - run: find dist -type f \( -name "*.html" -or -name "*.txt" \) -print -exec sed -i 's/_images\//images\//g' {} \;
      - run: find dist -type f \( -name "*.html" -or -name "*.txt" \) -print -exec sed -i 's/_sources\//sources\//g' {} \;
      - run: find dist -type f \( -name "*.html" -or -name "*.txt" \) -print -exec sed -i 's/_static\//static\//g' {} \;
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.
